name: Smart Rental Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Automated Testing & Compilation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm install
          cd backend && npm install && npx prisma generate

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm install

      - name: Execute Automated Test Suites (Auth, Properties, Leases, AI Engine)
        run: |
          npm run test:auth
          npm run test:property
          npm run test:lifecycle
          npm run test:ai

      - name: Build Frontend Application (Vite Production Build)
        run: |
          npm run build

      - name: Verify Bundle Integrity
        run: |
          test -f frontend/dist/index.html && echo "Frontend build verified successfully!"
