services:
  # All-in-One Fullstack Web Service (Hosts React Frontend + Node.js API + Static Assets)
  - type: web
    name: smart-rental-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
