services:
  # 1. Node.js Backend REST API
  - type: web
    name: smart-rental-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: smart-rental-ml
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: smart-rental-frontend
          property: host

  # 2. Python FastAPI AI Recommendation Microservice
  - type: web
    name: smart-rental-ml
    env: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 3. React Frontend UI (Static Site)
  - type: web
    name: smart-rental-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-rental-backend
          property: host
